name = "cloudflare-workers-ai-chat"
compatibility_date = "2026-05-05"
main = "./src/index.ts"

[ai]
binding = "AI"

[secrets]
required = ["TAVILY_API_KEY"]

[durable_objects]
bindings = [
    { name = "RATE_LIMITER", class_name = "RateLimiter" }
]

[[migrations]]
tag = "v1-rate-limit"
new_classes = ["RateLimiter"]